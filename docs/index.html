<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>ZenPlanner - Live Demo</title>
  <!-- Meta tags for standard PWA / Mobile optimization -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #1a1a2e; /* Same as the app background to prevent flash */
    }
    #root {
      width: 100%;
      height: 100%;
    }
    
    /* UX preloader to explain the WASM downloading phase */
    .loading-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(circle at 10% 20%, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #00E5FF;
      font-family: 'Poppins', sans-serif;
      z-index: 1000;
      transition: opacity 1s ease;
    }
    .spinner {
      width: 50px; height: 50px;
      border: 5px solid rgba(0, 229, 255, 0.2);
      border-top-color: #00E5FF;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin { 100% { transform: rotate(360deg); } }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Poppins:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>
  <div id="loading" class="loading-overlay">
    <div class="spinner"></div>
    <h2>Caricamento ZenPlanner in WebAssembly...</h2>
    <p style="color: #E2E8F0; opacity: 0.8; font-size: 0.9rem; text-align: center; max-width: 80%;">
      Download del motore Python e dei modelli ML in corso.<br>
      Il primo caricamento richiede alcuni secondi, verrà poi memorizzato in cache!
    </p>
  </div>
  <div id="root"></div>

  <!-- Inclusione libreria stlite (Serverless Streamlit via Pyodide) -->
  <script src="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.31.1/build/stlite.js"></script>  <script>
    const filesToFetch = {
      "src/api_dashboard/app.py": "../src/api_dashboard/app.py",
      "src/csp_scheduler/domain.py": "../src/csp_scheduler/domain.py",
      "src/csp_scheduler/csp.py": "../src/csp_scheduler/csp.py",
      "src/csp_scheduler/constraints.py": "../src/csp_scheduler/constraints.py",
      "src/csp_scheduler/solver.py": "../src/csp_scheduler/solver.py",
      "src/csp_scheduler/scheduler.py": "../src/csp_scheduler/scheduler.py",
      "src/ml_pipeline/models/tuned_best_model.pkl": "../src/ml_pipeline/models/tuned_best_model.pkl",
      "src/ml_pipeline/models/scaler.pkl": "../src/ml_pipeline/models/scaler.pkl",
      "src/ml_pipeline/models/model_features.pkl": "../src/ml_pipeline/models/model_features.pkl"
    };

    async function checkResources() {
      const loader = document.getElementById('loading');
      for (const [name, url] of Object.entries(filesToFetch)) {
        try {
          const resp = await fetch(url);
          if (!resp.ok) throw new Error(`Status ${resp.status}`);
          console.log(`✅ Risorsa caricata: ${name}`);
        } catch (e) {
          loader.innerHTML = `
            <div style="background: rgba(255,0,0,0.1); border: 2px solid #ff4757; padding: 25px; border-radius: 12px; margin-top:20px;">
              <h3 style="color: #ff4757; margin-top:0;">🛑 Errore Critico: File non trovato</h3>
              <p style="color: #E2E8F0;">Non riesco a trovare il file: <code style="color:#00E5FF;">${name}</code></p>
              <p style="color: #E2E8F0; font-size: 0.8rem;">Cercato in: ${url}</p>
              <button onclick="window.location.reload()" style="margin-top:20px; padding:10px 20px; background:#00E5FF; border:none; border-radius:8px; cursor:pointer;">Riprova</button>
            </div>`;
          loader.style.justifyContent = 'flex-start';
          loader.style.paddingTop = '10vh';
          return false;
        }
      }
      return true;
    }

    async function init() {
      const ok = await checkResources();
      if (!ok) return;

      stlite.mount({
        requirements: ["pandas", "scikit-learn", "joblib"], 
        entrypoint: "src/api_dashboard/app.py",
        files: {
          "src/api_dashboard/app.py": { url: "../src/api_dashboard/app.py" },
          "src/csp_scheduler/__init__.py": "", 
          "src/csp_scheduler/domain.py": { url: "../src/csp_scheduler/domain.py" },
          "src/csp_scheduler/csp.py": { url: "../src/csp_scheduler/csp.py" },
          "src/csp_scheduler/constraints.py": { url: "../src/csp_scheduler/constraints.py" },
          "src/csp_scheduler/solver.py": { url: "../src/csp_scheduler/solver.py" },
          "src/csp_scheduler/scheduler.py": { url: "../src/csp_scheduler/scheduler.py" },
          "src/ml_pipeline/__init__.py": "",
          "src/ml_pipeline/models/tuned_best_model.pkl": { url: "../src/ml_pipeline/models/tuned_best_model.pkl" },
          "src/ml_pipeline/models/scaler.pkl": { url: "../src/ml_pipeline/models/scaler.pkl" },
          "src/ml_pipeline/models/model_features.pkl": { url: "../src/ml_pipeline/models/model_features.pkl" },
          "assets/ZenPlannerLogo.png": { url: "../assets/ZenPlannerLogo.png" }
        }
      }, document.getElementById("root")).catch(err => {
        console.error(err);
      });
    }

    init();

    const observer = new MutationObserver((mutations) => {
      mutations.forEach((mutation) => {
        if (mutation.addedNodes) {
          for (let node of mutation.addedNodes) {
            if (node.tagName === 'IFRAME') {
              setTimeout(() => {
                const loader = document.getElementById('loading');
                if (loader) {
                  loader.style.opacity = '0';
                  setTimeout(() => loader.remove(), 1000);
                }
              }, 2000);
              observer.disconnect();
            }
          }
        }
      });
    });
    observer.observe(document.getElementById('root'), { childList: true });
  </script>
</body>
</html>
