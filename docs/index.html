<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>ZenPlanner - Live Demo</title>
  <!-- Meta tags for standard PWA / Mobile optimization -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #1a1a2e; /* Same as the app background to prevent flash */
    }
    #root {
      width: 100%;
      height: 100%;
    }
    
    /* UX preloader to explain the WASM downloading phase */
    .loading-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(circle at 10% 20%, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #00E5FF;
      font-family: 'Poppins', sans-serif;
      z-index: 1000;
      transition: opacity 1s ease;
    }
    .spinner {
      width: 50px; height: 50px;
      border: 5px solid rgba(0, 229, 255, 0.2);
      border-top-color: #00E5FF;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin { 100% { transform: rotate(360deg); } }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Poppins:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>
  <div id="loading" class="loading-overlay">
    <div class="spinner"></div>
    <h2>Caricamento ZenPlanner in WebAssembly...</h2>
    <p style="color: #E2E8F0; opacity: 0.8; font-size: 0.9rem; text-align: center; max-width: 80%;">
      Download del motore Python e dei modelli ML in corso.<br>
      Il primo caricamento richiede alcuni secondi, verrà poi memorizzato in cache!
    </p>
  </div>
  <div id="root"></div>

  <!-- Inclusione libreria stlite (Serverless Streamlit via Pyodide) -->
  <script src="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.31.1/build/stlite.js"></script>
  <script>
    stlite.mount({
      requirements: ["pandas", "scikit-learn", "joblib"], 
      entrypoint: "src/api_dashboard/app.py",
      
      // Costruiamo il Virtual File System simulando la ROOT della repository al 100%
      files: {
        "src/api_dashboard/app.py": { url: "../src/api_dashboard/app.py" },
        "src/csp_scheduler/__init__.py": "", // Inizializzatore del modulo
        "src/csp_scheduler/domain.py": { url: "../src/csp_scheduler/domain.py" },
        "src/csp_scheduler/csp.py": { url: "../src/csp_scheduler/csp.py" },
        "src/csp_scheduler/constraints.py": { url: "../src/csp_scheduler/constraints.py" },
        "src/csp_scheduler/solver.py": { url: "../src/csp_scheduler/solver.py" },
        "src/csp_scheduler/scheduler.py": { url: "../src/csp_scheduler/scheduler.py" },
        "src/ml_pipeline/__init__.py": "",
        "src/ml_pipeline/models/tuned_best_model.pkl": { url: "../src/ml_pipeline/models/tuned_best_model.pkl" },
        "src/ml_pipeline/models/scaler.pkl": { url: "../src/ml_pipeline/models/scaler.pkl" },
        "src/ml_pipeline/models/model_features.pkl": { url: "../src/ml_pipeline/models/model_features.pkl" },
        "assets/ZenPlannerLogo.png": { url: "../assets/ZenPlannerLogo.png" }
      }
    }, document.getElementById("root")).catch((err) => {
      const loader = document.getElementById('loading');
      if (loader) {
        let errorMsg = err.message || err.toString();
        let errorHtml = `<div style="background: rgba(255,0,0,0.1); border: 2px solid #ff4757; padding: 25px; border-radius: 12px; margin-top:20px; box-shadow: 0 4px 15px rgba(255,71,87,0.2);">
          <h3 style="color: #ff4757; margin-top:0;">🛑 Errore di Caricamento (Virtual File System)</h3>
          <p style="color: #E2E8F0; margin-bottom: 5px;">Non è stato possibile scaricare od avviare le risorse Python.</p>
          <code style="color: #ff6b81; display:block; padding: 12px; background: rgba(0,0,0,0.4); border-radius: 8px; font-size: 0.85rem; font-family: monospace;">${errorMsg}</code>
        </div>`;
        
        if (window.location.protocol === 'file:') {
            errorHtml += `<div style="margin-top:20px; padding: 20px; background: rgba(255, 159, 28, 0.1); border-left: 5px solid #FF9F1C; border-radius: 0 8px 8px 0;">
              <h4 style="color:#FF9F1C; margin-top:0; font-size: 1.1rem;">⚠️ Avvio Locale non supportato (CORS)</h4>
              <p style="color:#E2E8F0; font-size: 0.95rem; line-height: 1.5;">Per motivi di sicurezza, i browser moderni <b>impediscono</b> il fetch () di altri file locali (come Python e Modelli) quando apri banalmente l'HTML con doppio clic.<br><br>
              Per testare la Demo Locale, devi avviare un micro-server. Apri il terminale alla root e lancia:<br>
              <code style="background: rgba(0,229,255,0.1); color: #00E5FF; padding: 5px 10px; border-radius: 4px; display:inline-block; margin-top:10px;">python docs/serve.py</code></p>
            </div>`;
        }
        
        loader.innerHTML = errorHtml + `<button onclick="window.location.reload()" style="margin-top:25px; padding:12px 25px; border-radius:8px; border:none; background:#00E5FF; color:#0c0c14; font-weight:800; cursor:pointer; font-family:'Poppins', sans-serif;">🔄 Riprova il Caricamento</button>`;
        loader.style.justifyContent = 'flex-start';
        loader.style.paddingTop = '10vh';
      }
    });

    // Script UX per rimuovere l'overlay di caricamento una volta che Streamlit ha agganciato l'iframe base
    const observer = new MutationObserver((mutations) => {
      mutations.forEach((mutation) => {
        if (mutation.addedNodes && mutation.addedNodes.length > 0) {
          for (let i = 0; i < mutation.addedNodes.length; i++) {
             let node = mutation.addedNodes[i];
             if (node.tagName === 'IFRAME') {
                setTimeout(() => {
                  let loader = document.getElementById('loading');
                  if (loader) {
                    loader.style.opacity = '0';
                    setTimeout(() => loader.remove(), 1000); // 1 sec fade out
                  }
                  observer.disconnect();
                }, 2000); // Attendiamo il rendering del canvas Streamlit Python
             }
          }
        }
      });
    });
    observer.observe(document.getElementById('root'), { childList: true });
  </script>
</body>
</html>
