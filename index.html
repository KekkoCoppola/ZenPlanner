<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>ZenPlanner AI</title>
  <link rel="icon" type="image/png" href="assets/ZenPlannerLogo.png">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body,
    html {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #1a1a2e;
      font-family: 'Poppins', sans-serif;
      color: #E2E8F0;
    }

    #root {
      width: 100%;
      height: 100%;
    }

    .loading-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 10% 20%, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      transition: opacity 1s ease;
    }

    .loading-container {
      width: 90%;
      max-width: 500px;
      text-align: center;
    }

    .logo-glow {
      filter: drop-shadow(0 0 15px rgba(0, 229, 255, 0.4));
      margin-bottom: 25px;
      animation: pulse 2s infinite ease-in-out;
    }

    @keyframes pulse {

      0%,
      100% {
        transform: scale(1);
        opacity: 1;
      }

      50% {
        transform: scale(1.03);
        opacity: 0.8;
      }
    }

    .progress-wrapper {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      margin: 20px 0 10px 0;
      overflow: hidden;
      position: relative;
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #00E5FF, #7209b7);
      border-radius: 20px;
      transition: width 0.3s ease;
    }

    .status-msg {
      font-size: 0.85rem;
      height: 20px;
      opacity: 0.9;
      color: #00E5FF;
      font-weight: 600;
    }

    /* Registro dei LOG tecnici a schermo */
    .log-terminal {
      width: 100%;
      max-height: 120px;
      background: rgba(0, 0, 0, 0.5);
      border-radius: 8px;
      margin-top: 25px;
      padding: 10px;
      font-family: monospace;
      font-size: 0.7rem;
      text-align: left;
      color: #88c9ff;
      overflow-y: auto;
      text-shadow: 0 0 5px rgba(0, 229, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .log-line {
      border-bottom: 1px solid rgba(255, 255, 255, 0.03);
      padding: 2px 0;
    }

    .error-card {
      background: rgba(255, 71, 87, 0.15);
      border: 1px solid #ff4757;
      border-radius: 12px;
      padding: 25px;
      text-align: left;
      margin-top: 25px;
      box-shadow: 0 8px 32px rgba(255, 71, 87, 0.2);
    }

    .error-card code {
      background: rgba(0, 0, 0, 0.5);
      padding: 10px;
      border-radius: 8px;
      color: #ff6b81;
      font-size: 0.8rem;
      display: block;
      margin: 15px 0;
      overflow-x: auto;
      white-space: pre-wrap;
    }

    .btn-retry {
      background: #00E5FF;
      color: #1a1a2e;
      border: none;
      padding: 12px 25px;
      border-radius: 8px;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.2s;
    }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@800&family=Poppins:wght@400;600&display=swap"
    rel="stylesheet">
</head>

<body>
  <!-- GitHub Pages Trailing Slash Enforcer -->
  <script>
    (function () {
      const repoName = '/ZenPlanner';
      const path = window.location.pathname;
      if (path.endsWith(repoName) && !path.endsWith(repoName + '/')) {
        window.location.replace(window.location.href.replace(repoName, repoName + '/'));
      }
    })();
  </script>

  <!-- Capturing Console Logs to show real progress -->
  <script>
    const logBuffer = [];
    const originalLog = console.log;
    const originalError = console.error;

    function updateTerminal(msg) {
      const terminal = document.getElementById('log-terminal');
      if (terminal) {
        const line = document.createElement('div');
        line.className = 'log-line';
        line.innerText = `> ${msg.substring(0, 80)}${msg.length > 80 ? '...' : ''}`;
        terminal.appendChild(line);
        terminal.scrollTop = terminal.scrollHeight;
      }
    }

    console.log = function () {
      originalLog.apply(console, arguments);
      const msg = Array.from(arguments).join(' ');
      updateTerminal(msg);

      // Se intercettiamo parole chiave dei download pip
      if (msg.includes("Downloading") || msg.includes("Extracting")) {
        const status = document.getElementById('status');
        if (status) status.innerText = "Installazione: " + (msg.match(/([a-zA-Z0-9.\-_]+.whl)/)?.[0] || "pacchetto Python");
      }
    };
    console.error = function () {
      originalError.apply(console, arguments);
      updateTerminal("ERR: " + Array.from(arguments).join(' '));
    };

    window.onerror = function (msg, url, lineNo, columnNo, error) {
      const container = document.getElementById('error-container');
      if (container) {
        container.innerHTML = `
          <div class="error-card">
            <h3>🛑 Errore Critico</h3>
            <code>${msg}\n(Inizializzazione fallita)</code>
            <button class="btn-retry" onclick="window.location.reload()">Riprova</button>
          </div>
        `;
      }
      return false;
    };
  </script>

  <div id="loading" class="loading-overlay">
    <div class="loading-container">
      <img src="assets/ZenPlannerLogo.png" id="logo" class="logo-glow" width="120" alt="Logo">
      <h2 style="font-family: 'Outfit', sans-serif; font-weight: 800; letter-spacing: 1.5px; margin: 0; color: #FFF;">
        ZENPLANNER AI</h2>

      <div class="progress-wrapper">
        <div id="pbar" class="progress-bar"></div>
      </div>
      <div id="status" class="status-msg">Connessione a Pyodide...</div>

      <div id="log-terminal" class="log-terminal">
        <div class="log-line">Initializing WebAssembly Machine...</div>
      </div>

      <div id="error-container"></div>
    </div>
  </div>

  <div id="root"></div>

  <!-- stlite 0.75.0 - Più stabile su dispositivi mobile -->
  <script src="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.75.0/build/stlite.js"></script>

  <script>
    const statusEl = document.getElementById('status');
    const pbar = document.getElementById('pbar');

    async function initZenPlanner() {
      // Risoluzione robusta dei percorsi per GitHub Pages
      const getUrl = (p) => {
        const loc = window.location;
        const base = loc.protocol + '//' + loc.host + loc.pathname.replace(/\/$/, '');
        return `${base}/${p}`;
      };

      const files = {
        "src/api_dashboard/app.py": { url: getUrl("src/api_dashboard/app.py") },
        "src/csp_scheduler/__init__.py": "",
        "src/csp_scheduler/domain.py": { url: getUrl("src/csp_scheduler/domain.py") },
        "src/csp_scheduler/csp.py": { url: getUrl("src/csp_scheduler/csp.py") },
        "src/csp_scheduler/constraints.py": { url: getUrl("src/csp_scheduler/constraints.py") },
        "src/csp_scheduler/solver.py": { url: getUrl("src/csp_scheduler/solver.py") },
        "src/csp_scheduler/scheduler.py": { url: getUrl("src/csp_scheduler/scheduler.py") },
        "src/ml_pipeline/__init__.py": "",
        "src/ml_pipeline/models/tuned_best_model.pkl": { url: getUrl("src/ml_pipeline/models/tuned_best_model.pkl") },
        "src/ml_pipeline/models/scaler.pkl": { url: getUrl("src/ml_pipeline/models/scaler.pkl") },
        "src/ml_pipeline/models/model_features.pkl": { url: getUrl("src/ml_pipeline/models/model_features.pkl") },
        "assets/ZenPlannerLogo.png": { url: getUrl("assets/ZenPlannerLogo.png") }
      };

      try {
        pbar.style.width = "10%";
        let prg = 10;
        const timer = setInterval(() => {
          if (prg < 98) {
            prg += (prg < 40) ? 0.3 : 0.05;
            pbar.style.width = prg + "%";
          }
        }, 500);

        // Timeout di cortesia per connessioni lente su mobile
        const slowLoadTimeout = setTimeout(() => {
          if (statusEl.innerText.includes("Connessione")) {
            statusEl.innerText = "Il download dei pacchetti (pandas/sklearn) richiede tempo su mobile...";
            statusEl.style.color = "#FF9F1C";
          }
        }, 15000);

        const onAppReady = () => {
          clearInterval(timer);
          clearTimeout(slowLoadTimeout);
          pbar.style.width = "100%";
          statusEl.innerText = "Benvenuto in ZenPlanner!";
          statusEl.style.color = "#00E5FF";
          setTimeout(() => {
            const loadingEl = document.getElementById('loading');
            if (loadingEl) {
              loadingEl.style.opacity = '0';
              setTimeout(() => {
                loadingEl.remove();
                console.log = originalLog;
                console.error = originalError;
              }, 1000);
            }
          }, 800);
        };

        const observer = new MutationObserver((mutations, obs) => {
          if (document.querySelector('[data-testid="stApp"]')) {
            onAppReady();
            obs.disconnect();
          }
        });
        observer.observe(document.getElementById('root'), { childList: true, subtree: true });

        if (document.querySelector('[data-testid="stApp"]')) {
          onAppReady();
          observer.disconnect();
        }

        await stlite.mount({
          requirements: ["pandas", "scikit-learn"],
          entrypoint: "src/api_dashboard/app.py",
          files: files,
          sharedWorker: false, // Disabilita SharedWorker per compatibilità mobile (Safari/iOS)
          streamlitConfig: {
            "server.baseUrlPath": "/ZenPlanner/",
            "theme.base": "dark",
            "theme.primaryColor": "#00B4D8",
            "theme.backgroundColor": "#0B132B",
            "theme.secondaryBackgroundColor": "#141E3D",
            "theme.textColor": "#FFFFFF",
            "theme.font": "sans serif"
          }
        }, document.getElementById("root"));

      } catch (err) {
        console.error("Critical Stlite Failure:", err);
        statusEl.innerText = "Errore durante il caricamento. Controlla la console.";
        statusEl.style.color = "#ff4757";
      }
    }

    // Caricamento asincrono con fallback
    if (window.stlite) {
      initZenPlanner();
    } else {
      const checkStlite = setInterval(() => {
        if (window.stlite) {
          clearInterval(checkStlite);
          initZenPlanner();
        }
      }, 100);
      window.addEventListener('load', () => {
        setTimeout(() => {
          if (window.stlite) {
            clearInterval(checkStlite);
            // initZenPlanner già chiamato o in coda
          } else {
             console.error("Stlite library failed to load.");
          }
        }, 2000);
      });
    }
  </script>
</body>

</html>
